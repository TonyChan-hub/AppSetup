name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check version is not already published
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view @bear1210/create-rn-template version 2>/dev/null || echo "0.0.0")
          if [ "$PKG_VERSION" = "$NPM_VERSION" ]; then
            echo "Version $PKG_VERSION already exists on npm; skip publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing version $PKG_VERSION (npm latest: $NPM_VERSION)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        id: version_check

      - name: Publish to npm
        if: steps.version_check.outputs.skip != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
