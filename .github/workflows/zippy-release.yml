name: Release Zippy (macOS)

on:
  push:
    branches:
      - main
    paths:
      - 'packages/zippy/package.json'
      - 'packages/zippy/**'
      - 'packages/zippy-probe-protocol/**'
      - '.github/workflows/zippy-release.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read package version
        id: version
        working-directory: packages/zippy
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=zippy-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if release tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release tag $TAG already exists."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macOS app
        if: steps.tag_check.outputs.skip != 'true'
        working-directory: packages/zippy
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Write updater latest.json + docs download.json
        if: steps.tag_check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BUNDLE_ROOT="packages/zippy/src-tauri/target/release/bundle"
          UPDATER_DIR="$BUNDLE_ROOT"
          # Prefer macos updater tarballs directory when present
          if [ -d "$BUNDLE_ROOT/macos" ]; then
            UPDATER_DIR="$BUNDLE_ROOT/macos"
          fi
          node packages/zippy/scripts/write-latest-json.mjs \
            "$VERSION" \
            "$UPDATER_DIR" \
            "$TAG" \
            "${{ github.repository }}"
          node packages/zippy/scripts/write-download-json.mjs \
            "$VERSION" \
            "$BUNDLE_ROOT" \
            "$TAG" \
            "${{ github.repository }}"
          # Also copy manifests next to dmg outputs for easier upload globs
          mkdir -p "$BUNDLE_ROOT/dmg"
          cp "$UPDATER_DIR/latest.json" "$BUNDLE_ROOT/dmg/latest.json" 2>/dev/null || true
          cp "$UPDATER_DIR/latest.json" "$BUNDLE_ROOT/latest.json"
          cp "$BUNDLE_ROOT/download.json" "$BUNDLE_ROOT/dmg/download.json" 2>/dev/null || true

      - name: Create GitHub Release
        if: steps.tag_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          ASSETS=()
          for pattern in \
            packages/zippy/src-tauri/target/release/bundle/dmg/*.dmg \
            packages/zippy/src-tauri/target/release/bundle/macos/*.app.tar.gz \
            packages/zippy/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig \
            packages/zippy/src-tauri/target/release/bundle/latest.json \
            packages/zippy/src-tauri/target/release/bundle/download.json
          do
            for file in $pattern; do
              ASSETS+=("$file")
            done
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found"
            find packages/zippy/src-tauri/target/release/bundle -maxdepth 3 -type f || true
            exit 1
          fi
          NOTES=$(printf '%s\n' \
            "Automated macOS release for @bear1210/zippy v${VERSION} (Tauri)." \
            "" \
            "## Download" \
            "- Docs: https://tonychan-hub.github.io/AppSetup/guide/zippy#download" \
            "- Docs (中文): https://tonychan-hub.github.io/AppSetup/zh/guide/zippy#download")
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Zippy v${VERSION}" \
            --notes "$NOTES" \
            "${ASSETS[@]}"
