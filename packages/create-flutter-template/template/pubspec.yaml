name: flutter_template_app
description: Business-free Flutter scaffold — start features here.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  dio: ^5.7.0
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.3
  flutter_screenutil: ^5.9.3
  flutter_easyloading: ^3.0.5
  permission_handler: ^11.3.1
  go_router: ^14.2.0
  share_plus: ^10.0.0
  gal: ^2.3.0
  sensors_plus: ^6.1.1
  zippy_flutter:
    path: packages/zippy_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  flutter_spinkit: 5.1.0

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
