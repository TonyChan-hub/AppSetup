<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zippy</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">Z</span>
          <div>
            <div class="brand-name">Zippy</div>
            <div class="brand-sub">mobile inspector</div>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-item is-active" type="button" data-panel="device">Device</button>
          <button class="nav-item" type="button" data-panel="kv">MMKV / KV</button>
          <button class="nav-item" type="button" data-panel="db">SQLite</button>
          <button class="nav-item" type="button" data-panel="network">Network</button>
          <button class="nav-item" type="button" data-panel="perf">Perf</button>
        </nav>
        <div class="sidebar-footer">
          <div id="runtime-meta" class="meta">—</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="panel-title">Device</h1>
            <p id="panel-desc" class="muted">
              Connect a debug app to inspect runtime data.
            </p>
          </div>
          <div class="status">
            <span class="status-dot" id="status-dot"></span>
            <span id="connection-status">Waiting for device</span>
          </div>
        </header>

        <section class="panel" id="panel"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
